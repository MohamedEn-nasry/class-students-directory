# Netlify deploy config.
# If your API lives on another host, proxy /api/* to avoid CORS issues.
# Replace https://YOUR_BACKEND_HOST with your real API origin.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_HOST/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
